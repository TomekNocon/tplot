name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (per rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        env:
          # Tests assume truecolor capability for ANSI assertions.
          # CI runners have no TTY, so we set this explicitly.
          COLORTERM: truecolor
          TERM: xterm-256color
        run: cargo test --workspace --all-targets
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo fmt
        run: cargo fmt --all --check
