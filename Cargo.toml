[workspace]
resolver = "2"
members = [
    "crates/tplot",
    "crates/tplot-core",
    "crates/tplot-protocol",
    "crates/tplot-render",
    "crates/tplot-story",
]

[workspace.package]
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/TomekNocon/tplot"
homepage    = "https://github.com/TomekNocon/tplot"
description = "Storytelling-first terminal data visualization."
readme      = "README.md"
keywords    = ["chart", "plot", "cli", "terminal", "data"]
categories  = ["command-line-utilities", "visualization"]
authors     = ["Tomek Nocon <tomek.lm10@gmail.com>"]

[workspace.dependencies]
tplot-protocol = { path = "crates/tplot-protocol", version = "0.1.0" }
tplot-core     = { path = "crates/tplot-core",     version = "0.1.0" }
tplot-render   = { path = "crates/tplot-render",   version = "0.1.0" }
tplot-story    = { path = "crates/tplot-story",    version = "0.1.0" }

clap        = { version = "4",    features = ["derive"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
csv         = "1"
crossterm   = "0.28"
anyhow      = "1"
thiserror   = "2"
insta       = { version = "1", features = ["yaml"] }
proptest    = "1"
image       = { version = "0.25", default-features = false, features = ["png"] }
base64      = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
